services:
  postgres:
    image: postgres:16-alpine
    container_name: petsitting-hub-db
    environment:
      POSTGRES_DB: petsitting_hub
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - petsitting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d petsitting_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petsitting-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petsitting-hub-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/petsitting_hub
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-cGV0c2l0dGluZ2h1YnNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjEyMzQ1Njc4OTA=}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:-admin123}
      SEED_EMAIL: ${SEED_EMAIL:-admin@petsitting.com}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petsitting-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petsitting-hub-frontend
    ports:
      - "4203:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - petsitting-net

volumes:
  petsitting_pgdata:
    name: petsitting_pgdata

networks:
  petsitting-net:
    driver: bridge
