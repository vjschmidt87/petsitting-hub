<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="logo">
      <span class="logo-icon">🐾</span>
      <span class="logo-text">{{ t.t('app.title') }}</span>
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
    </button>

    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen = false">
        {{ t.t('nav.home') }}
      </a>
      <a routerLink="/tips" routerLinkActive="active" (click)="menuOpen = false">
        {{ t.t('nav.tips') }}
      </a>
      <a routerLink="/contact" routerLinkActive="active" (click)="menuOpen = false">
        {{ t.t('nav.contact') }}
      </a>
      @if (auth.isAuthenticated) {
        <a routerLink="/my-pets" routerLinkActive="active" (click)="menuOpen = false">
          {{ t.t('nav.myPets') }}
        </a>
      }
    </nav>

    <div class="header-actions" [class.open]="menuOpen">
      <button class="icon-btn" (click)="t.toggleLang()" [title]="t.t('header.langToggle')">
        {{ t.t('header.langToggle') }}
      </button>

      <button class="icon-btn" (click)="theme.toggleTheme()"
              [title]="theme.isDark() ? t.t('header.themeLight') : t.t('header.themeDark')">
        @if (theme.isDark()) {
          ☀️
        } @else {
          🌙
        }
      </button>

      @if (auth.isAuthenticated) {
        <span class="username">{{ auth.currentUser?.username }}</span>
        <button class="btn btn--outline btn--sm" (click)="logout(); menuOpen = false">
          {{ t.t('nav.logout') }}
        </button>
      } @else {
        <a routerLink="/login" class="btn btn--outline btn--sm" (click)="menuOpen = false">
          {{ t.t('nav.login') }}
        </a>
        <a routerLink="/register" class="btn btn--primary btn--sm" (click)="menuOpen = false">
          {{ t.t('nav.register') }}
        </a>
      }
    </div>
  </div>
</header>
